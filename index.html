<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Admin Dashboard</title>
</head>
<body>
    <div class="container">
        <div class="side-bar">
            <div class="top-section">
                <img src="./svg-icons/view-dashboard.svg" class="dashboard-icon">
                <p>Dashboard</p>
            </div> 
            <div class="navigation">
                <div class="essentials"> 
                    <div class="nav-icon-button">
                        <img src="./svg-icons/home.svg" class="essential-icon">
                        <a href="">Home</a>
                    </div>
                    <div class="nav-icon-button">
                        <img src="./svg-icons/account.svg" class="essential-icon">
                        <a href="">Profile</a>
                    </div>
                    <div class="nav-icon-button">
                        <img src="./svg-icons/message.svg" class="essential-icon">
                        <a href="">Messages</a>
                    </div>
                    <div class="nav-icon-button">
                        <img src="./svg-icons/clock-time-four.svg" class="essential-icon">
                        <a href="">History</a>
                    </div>
                    <div class="nav-icon-button">
                        <img src="./svg-icons/stack-exchange.svg" class="essential-icon">
                        <a href="">Task</a>
                    </div>
                    <div class="nav-icon-button">
                        <img src="./svg-icons/account-group.svg" class="essential-icon">
                        <a href="">Communities</a>
                    </div>
                </div>
                <div class="branding">
                    <div class="branding-icon-button">
                        <img src="./svg-icons/cog.svg" class="essential-icon">
                        <a href="">Setting</a>
                    </div>
                    <div class="branding-icon-button">
                        <img src="./svg-icons/help-box.svg" class="essential-icon">
                        <a href="">Support</a>
                    </div>
                    <div class="branding-icon-button">
                        <img src="./svg-icons/help-box.svg" class="essential-icon">
                        <a href="">Privacy</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="header">
            <div class="search-section">
                <img src="./svg-icons/magnify.svg" class="essential-icon">
                <input type="search" placeholder="Enter project name">
            </div>
            <div class="right-corner">
                <img src="./svg-icons/bell-ring.svg" class="essential-icon">
                <img src="./svg-icons/account-tie.svg" class="account-icon">
                <p>Japhet B</p>
            </div>
            <div class="main-profile">
                <img src="./svg-icons/account-tie.svg" class="account-icon">
                <div class="greeting">
                    <p>Hi there,</p>
                    <p>Japhet B (@jahphetB)</p>
                </div>
            </div>
            <div class="create">
                <ul>
                    <li><button>New</button></li>
                    <li><button>Upload</button></li>
                    <li><button>Share</button></li>
                </ul>
            </div>
        </div>
        <div class="main-content"> 
            <div class="projects">
                <div class="project"> project 1</div>
                <div class="project"> project 2</div>
                <div class="project"> project 3</div>
                <div class="project"> project 4</div>
                <div class="project"> project 5</div>
                <div class="project"> project 6</div>
            </div>
            <div class="announcements">
                announcements
            </div>
            <div class="trading">
                trading
            </div>
        </div>
    </div>
</body>
</html>
